<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf">
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Shelf</title>
<style>
:root{--paper:#f6f4ef;--card:#fff;--ink:#17130f;--muted:#8b8578;--line:#e4e0d7;--best:#1f7a54;--best-tint:#e8f2ec;--star:#f5a623;--danger:#b23b2e;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;}
header{position:sticky;top:0;z-index:10;background:var(--paper);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.wm{font-weight:800;letter-spacing:.2em;font-size:17px;}
.wm small{display:block;font-weight:600;letter-spacing:.12em;font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink);}
main{padding:12px 16px;}
h2.section{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px;}
.search,select,input{font:inherit;font-size:16px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card:active{background:#f0ece3;}
.pname{font-weight:650;font-size:15px;letter-spacing:-.01em;}
.psub{font-size:11px;color:var(--muted);margin-top:3px;}
.price{font-size:15px;font-weight:750;color:var(--best);text-align:right;white-space:nowrap;}
.price small{display:block;font-weight:600;font-size:10px;color:var(--muted);}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.empty{color:var(--muted);text-align:center;padding:48px 16px;font-size:14px;}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;background:none;border:none;padding:9px 0 8px;color:var(--muted);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button .ic{font-size:19px;line-height:1;}
nav button.on{color:var(--ink);}
.overlay{position:fixed;inset:0;background:rgba(23,19,15,.4);z-index:50;display:flex;align-items:flex-end;}
.sheet{background:var(--paper);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 2px;font-size:19px;}
.rowline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;}
.rowline:last-child{border:none;}
.rowline.best{background:var(--best-tint);border-radius:8px;}
.stamp{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--best);border:1px solid var(--best);border-radius:4px;padding:1px 4px;margin-left:6px;}
.vhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px;}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 2px 5px;}
.btn{display:block;width:100%;text-align:center;background:var(--ink);color:var(--paper);border:none;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;margin-top:18px;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn:disabled{opacity:.4;}
.two{display:flex;gap:9px;}
.two>div{flex:1;}
textarea{font:inherit;font-size:13px;width:100%;min-height:150px;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--card);white-space:pre;}
.note{font-size:12px;color:var(--muted);margin:6px 2px;line-height:1.5;}
.star{color:var(--star);}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:99;opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wm">SHELF<small>price ledger</small></div>
    <button class="iconbtn" onclick="openMenu()">Backup</button>
  </header>
  <main id="main"></main>
</div>
<nav>
  <button data-tab="reg" class="on" onclick="go('reg')"><span class="ic">★</span>Regulars</button>
  <button data-tab="store" onclick="go('store')"><span class="ic">▦</span>By Store</button>
  <button data-tab="cmp" onclick="go('cmp')"><span class="ic">⇅</span>Compare</button>
  <button data-tab="add" onclick="go('add')"><span class="ic">＋</span>Add</button>
</nav>
<div id="toast" class="toast"></div>

const UNITS = {
 "oz":["lb",0.0625],"lb":["lb",1],"g":["lb",0.00220462],"kg":["lb",2.20462],
 "fl oz":["fl oz",1],"cup":["fl oz",8],"pint":["fl oz",16],"quart":["fl oz",32],"gallon":["fl oz",128],"ml":["fl oz",0.033814],"l":["fl oz",33.814],

};
const UNIT_LIST = Object.keys(UNITS);

function load(){ try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return JSON.parse(JSON.stringify(SEED)); }
function save(){ try{localStorage.setItem(KEY, JSON.stringify(ROWS));}catch(e){ toast("Couldn't save on this device"); } }
function up(r){ const u=UNITS[r.unit]; if(!u||!r.size||!r.price||r.price<=0) return null; return r.price/(r.size*u[1]); }
function baseOf(prod){ for(const r of ROWS){ if(r.p===prod && UNITS[r.unit]) return UNITS[r.unit][0]; } return ""; }
function fmt(v){ if(v==null) return "–"; return "$"+(v<0.1?v.toFixed(3):v.toFixed(2)); }
function esc(s){ return (s==null?"":(""+s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const STORES = (()=>{ const o=["Whole Foods","Amazon Fresh","Trader Joe's","Amazon","RC Farms","Target","Ralphs","Costco"]; const s=new Set(ROWS.map(r=>r.store)); s.forEach(x=>{if(!o.includes(x))o.push(x);}); return o.filter(x=>s.has(x)); })();

const CATORDER=["Fruit","Vegetables","Dairy","Frozen","Bakery","Deli","Meat","Pantry","Snacks","Sauces & Dips","Beverages","Herbs","Household","Medicine","Personal Care","Supplements","Other"];
function catRank(c){const i=CATORDER.indexOf(c);return i<0?999:i;}
function products(){ const m=new Map(); for(const r of ROWS){ if(!m.has(r.p)) m.set(r.p,{p:r.p,cat:r.cat}); } return [...m.values()]; }
function favSet(){ const s=new Set(); for(const r of ROWS){ if(r.fav) s.add(r.p); } return s; }
// latest price per store: per variant take max-date up, then min across variants
function storePrices(prod){
  const byStore={};
  const groups={};
  for(const r of ROWS){ if(r.p!==prod) continue; const u=up(r); if(u==null) continue;
    const vk=r.brand+"|"+r.org+"|"+r.size+"|"+r.unit; (groups[vk]=groups[vk]||[]).push(r); }
  const perVarStore={};
  for(const vk in groups){ const byS={}; for(const r of groups[vk]){ const d=r.d||"0000"; const u2=up(r); const c=byS[r.store]; if(!c||d>c.d||(d===c.d&&u2<c.u)) byS[r.store]={d,u:u2}; }
    for(const st in byS){ if(perVarStore[st]==null||byS[st].u<perVarStore[st]) perVarStore[st]=byS[st].u; } }
  return perVarStore;
}
function best(prod){ const sp=storePrices(prod); let b=null,bs=null; for(const st in sp){ if(b==null||sp[st]<b){b=sp[st];bs=st;} } return {price:b,store:bs,sp}; }

function go(t){ tab=t; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); render(); window.scrollTo(0,0); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

function render(){
  const M=document.getElementById("main");
  if(tab==="reg") M.innerHTML=viewList(products().filter(p=>favSet().has(p.p)),"No favourites yet.");
  else if(tab==="cmp") M.innerHTML=viewCompare();
  else if(tab==="store") M.innerHTML=viewStore();
  else if(tab==="add") M.innerHTML=viewAdd();
  if(tab==="cmp"){ const s=document.getElementById("q"); if(s){ s.value=search; s.oninput=e=>{search=e.target.value; renderCmpList();}; } renderCmpList(); }
}

function cardHTML(p){ const b=best(p.p); const per=baseOf(p.p);
  return `<div class="card" onclick="detail('${encodeURIComponent(p.p)}')">
    <div><div class="pname">${esc(p.p)}${favSet().has(p.p)?' <span class="star">★</span>':''}</div>
    <div class="psub">${esc(p.cat)}${b.store?' · best @ '+esc(b.store):''}</div></div>
    <div class="price mono">${b.price!=null?fmt(b.price):'–'}<small>${b.price!=null&&per?('/'+per):'no price'}</small></div></div>`;
}
function viewList(list,emptyMsg){
  list.sort((a,b)=>(catRank(a.cat)-catRank(b.cat))||a.p.localeCompare(b.p));
  if(!list.length) return `<div class="empty">${emptyMsg}</div>`;
  let h="",cur=null;
  for(const p of list){ if(p.cat!==cur){h+=`<h2 class="section">${esc(p.cat)}</h2>`;cur=p.cat;} h+=cardHTML(p); }
  return h;
}
function viewCompare(){ return `<input id="q" class="search" placeholder="Search all products…" autocapitalize="none"><div id="cmplist"></div>`; }
function renderCmpList(){ const el=document.getElementById("cmplist"); if(!el)return;
  let list=products(); const q=search.trim().toLowerCase();
  if(q) list=list.filter(p=>p.p.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q));
  el.innerHTML=viewList(list, q?"No matches.":"No products."); }

function viewStore(){
  if(!storeSel) storeSel=STORES[0];
  let chips=`<div class="chips">`+STORES.map(s=>`<button class="chip ${s===storeSel?'on':''}" onclick="storeSel='${esc(s).replace(/'/g,"\\'")}';render()">${esc(s)}</button>`).join("")+`</div>`;
  // products where this store is the cheapest (best@)
  const wins=[]; for(const p of products()){ const b=best(p.p); if(b.store===storeSel){ wins.push({p:p.p,cat:p.cat,price:b.price,per:baseOf(p.p)}); } }
  wins.sort((a,b)=>(catRank(a.cat)-catRank(b.cat))||a.p.localeCompare(b.p));
  let body = wins.length? "" : `<div class="empty">Nothing is cheapest at ${esc(storeSel)} yet.</div>`;
  let cur=null;
  for(const w of wins){ if(w.cat!==cur){body+=`<h2 class="section">${esc(w.cat)}</h2>`;cur=w.cat;}
    body+=`<div class="card" onclick="detail('${encodeURIComponent(w.p)}')"><div><div class="pname">${esc(w.p)}</div><div class="psub">cheapest here</div></div><div class="price mono">${fmt(w.price)}<small>/${esc(w.per)}</small></div></div>`; }
  return chips + `<h2 class="section">Best value at ${esc(storeSel)} (${wins.length})</h2>` + body;
}

function detail(enc){ const prod=decodeURIComponent(enc); const b=best(prod); const per=baseOf(prod);
  let h=`<h3>${esc(prod)}</h3><div class="note">${esc(products().find(x=>x.p===prod).cat)}${per?' · compared per '+esc(per):''}</div>`;
  h+=`<div class="vhead">Current price by store</div>`;
  const sp=b.sp; let any=false;
  for(const st of STORES){ if(sp[st]==null) continue; any=true; const isb=st===b.store;
    h+=`<div class="rowline ${isb?'best':''}"><div>${esc(st)}${isb?'<span class="stamp">BEST</span>':''}</div><div></div><div class="mono">${fmt(sp[st])}/${esc(per)}</div></div>`; }
  if(!any) h+=`<div class="note">No priced entries yet.</div>`;
  // variants
  const vs={}; for(const r of ROWS){ if(r.p!==prod) continue; const vk=(r.brand||'—')+' · '+(r.org==='Yes'?'Organic':'Conv')+(r.size!==''?(' · '+r.size+' '+r.unit):''); const u=up(r); const d=r.d||'0000'; const c=vs[vk]; if(!c||d>c.d||(d===c.d&&(u==null?9e9:u)<(c.u==null?9e9:c.u))) vs[vk]={d,u,store:r.store}; }
  const vk=Object.keys(vs); if(vk.length){ h+=`<div class="vhead">Variants (latest)</div>`;
    vk.sort((a,b)=>(vs[a].u==null?9e9:vs[a].u)-(vs[b].u==null?9e9:vs[b].u));
    for(const k of vk){ h+=`<div class="rowline"><div>${esc(k)}</div><div class="psub">${esc(vs[k].store)}</div><div class="mono">${vs[k].u!=null?fmt(vs[k].u)+'/'+esc(per):'–'}</div></div>`; } }
  h+=`<button class="btn" onclick="closeSheet();go('add');prefill('${encodeURIComponent(prod)}')">＋ Add a price for this</button>`;
  h+=`<button class="btn ghost" onclick="closeSheet()">Close</button>`;
  showSheet(h);
}
function showSheet(html){ const o=document.createElement("div"); o.className="overlay"; o.id="ov"; o.onclick=e=>{if(e.target===o)closeSheet();};
  o.innerHTML=`<div class="sheet">${html}</div>`; document.body.appendChild(o); }
function closeSheet(){ const o=document.getElementById("ov"); if(o)o.remove(); }

let prefillProd="";
function prefill(enc){ prefillProd=decodeURIComponent(enc); render(); }
function viewAdd(){
  const today=new Date().toISOString().slice(0,10);
  const dl=[...new Set(ROWS.map(r=>r.p))].sort().map(p=>`<option value="${esc(p)}">`).join("");
  const so=STORES.map(s=>`<option>${esc(s)}</option>`).join("");
  const uo=UNIT_LIST.map(u=>`<option>${esc(u)}</option>`).join("");
  const pv=esc(prefillProd);
  return `<h2 class="section">Add a price</h2>
   <label>Product</label><input id="f_p" list="prods" value="${pv}" placeholder="e.g. Bananas" autocapitalize="words"><datalist id="prods">${dl}</datalist>
   <div class="two"><div><label>Brand</label><input id="f_b" placeholder="optional"></div>
   <div><label>Organic</label><select id="f_o"><option>No</option><option>Yes</option></select></div></div>
   <label>Store</label><select id="f_s">${so}</select>
   <div class="two"><div><label>Size</label><input id="f_sz" inputmode="decimal" placeholder="e.g. 16"></div>
   <div><label>Unit</label><select id="f_u">${uo}</select></div>
   <div><label>Price $</label><input id="f_pr" inputmode="decimal" placeholder="4.99"></div></div>
   <label>Date</label><input id="f_d" type="date" value="${today}">
   <label>Category</label><input id="f_cat" placeholder="e.g. Fruit" value="${esc(prefillProd?(products().find(x=>x.p===prefillProd)||{}).cat||'':'')}">
   <div id="f_live" class="note mono"></div>
   <button class="btn" onclick="addRow()">Save price</button>`;
}
function liveUP(){ const el=document.getElementById("f_live"); if(!el)return;
  const sz=parseFloat(document.getElementById("f_sz").value), u=document.getElementById("f_u").value, pr=parseFloat(document.getElementById("f_pr").value);
  const uu=UNITS[u]; if(sz&&pr&&uu){ el.textContent="= "+fmt(pr/(sz*uu[1]))+"/"+uu[0]; } else el.textContent=""; }
function addRow(){
  const p=document.getElementById("f_p").value.trim(); const pr=parseFloat(document.getElementById("f_pr").value);
  if(!p){toast("Add a product name");return;} if(!pr){toast("Add a price");return;}
  const prod=p; const existing=ROWS.find(r=>r.p.toLowerCase()===prod.toLowerCase()); const canonical=existing?existing.p:prod;
  const cat=document.getElementById("f_cat").value.trim()|| (existing?existing.cat:"Other");
  const r={d:document.getElementById("f_d").value||new Date().toISOString().slice(0,10),cat,p:canonical,
    brand:document.getElementById("f_b").value.trim(),org:document.getElementById("f_o").value,
    store:document.getElementById("f_s").value,size:(parseFloat(document.getElementById("f_sz").value)||""),
    unit:document.getElementById("f_u").value,price:pr,note:"",fav:favSet().has(canonical)?1:0};
  ROWS.push(r); save(); prefillProd=""; toast("Saved "+canonical); go("cmp");
}
document.addEventListener("input",e=>{ if(["f_sz","f_u","f_pr"].includes(e.target.id)) liveUP(); });

function openMenu(){
  const csvHead=["Date","Category","Product","Brand","Organic","Store","Size","Unit","Price","Source / note"];
  const csv=[csvHead.join(",")].concat(ROWS.map(r=>[r.d,r.cat,r.p,r.brand,r.org,r.store,r.size,r.unit,r.price==null?"":r.price,r.note].map(c=>`"${(""+ (c==null?"":c)).replace(/"/g,'""')}"`).join(","))).join("\n");
  const added=ROWS.length-SEED.length;
  let h=`<h3>Backup &amp; sync</h3>
   <div class="note">Your data lives on this device. Export to back up or to paste new prices into your spreadsheet. ${added>0?('<b>'+added+' new price'+(added===1?'':'s')+' added since seed.</b>'):''}</div>
   <button class="btn" onclick="dl('shelf-backup.json',JSON.stringify(ROWS,null,1))">Download backup (JSON)</button>
   <button class="btn ghost" onclick="showCSV()">Show CSV for spreadsheet</button>
   <div class="vhead">Restore / import</div>
   <textarea id="imp" placeholder="Paste a JSON backup here…"></textarea>
   <button class="btn ghost" onclick="doImport()">Import (replace data)</button>
   <button class="btn ghost" onclick="if(confirm('Reset to the original seeded data? This wipes prices you added.')){localStorage.removeItem(KEY);ROWS=load();closeSheet();go('reg');toast('Reset');}">Reset to seed</button>
   <button class="btn ghost" onclick="closeSheet()">Close</button>`;
  showSheet(h);
  window._csv=csv;
}
function showCSV(){ showSheet(`<h3>CSV</h3><div class="note">Copy and paste into the Prices tab of your spreadsheet (skip the header row if appending).</div><textarea readonly onclick="this.select()">${esc(window._csv)}</textarea><button class="btn ghost" onclick="closeSheet();openMenu()">Back</button>`); }
function dl(name,txt){ try{const b=new Blob([txt],{type:"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();toast("Downloaded");}catch(e){ showSheet(`<h3>Backup</h3><div class="note">Copy this and save it somewhere safe.</div><textarea readonly onclick="this.select()">${esc(txt)}</textarea><button class="btn ghost" onclick="closeSheet();openMenu()">Back</button>`);} }
function doImport(){ try{const v=document.getElementById("imp").value.trim(); if(!v){toast("Paste a backup first");return;} const a=JSON.parse(v); if(!Array.isArray(a)) throw 0; ROWS=a; save(); closeSheet(); go("reg"); toast("Imported "+a.length+" rows"); }catch(e){ toast("Couldn't read that JSON"); } }

go("reg");
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
